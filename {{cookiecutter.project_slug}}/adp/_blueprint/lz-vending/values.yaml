resource_group_name: "rg-aks-__ENV__-__LOCATION__"

oidc_issuer_url: "https://__LOCATION__.oic.prod-aks.azure.com/__TENANT_ID__/4328177b-e892-42df-8808-862c0e2c6dc9/"

# --- When vnet_enabled: true, define the VNet and subnets here ---
vnet_enabled: false
#vnet:
#  address_space: ["__VNET_CIDR__"]
#  subnets:
#    - key: "aks-nodes"
#      name: "snet-aks-nodes"
#      cidrs: ["__AKS_SUBNET_CIDR__"]
#aks_subnet_name: "snet-aks-nodes"

# --- When vnet_enabled: false, provide an existing subnet ---
subnet:
  name: "snet-aks-nodes"
  address_prefixes: ["__AKS_SUBNET_CIDR__"]
  vnet_resource_id: "__VNET_RESOURCE_ID__"

user_managed_identities:
  kubelet: {}
  controlplane:
    role_assignments:
      private_dns_contributor:
        definition: "Private DNS Zone Contributor"
        relative_scope: "__CONTROLPLANE_DNS_SCOPE__"
  dns:
    role_assignments:
      dns_contributor:
        definition: "Private DNS Zone Contributor"
        relative_scope: "__DNS_ZONE_SCOPE__"
    federated_credentials_advanced:
      external-dns:
        subject_identifier: "system:serviceaccount:external-dns:external-dns-sa"
  eso:
    role_assignments:
      kv_secrets_user:
        definition: "Key Vault Secrets User"
        relative_scope: "__KEY_VAULT_SCOPE__"
    federated_credentials_advanced:
      eso:
        subject_identifier: "system:serviceaccount:external-secrets-operator:external-secrets-operator-sa"
  tempo:
    role_assignments:
      storage_contributor:
        definition: "Storage Blob Data Contributor"
        relative_scope: "__STORAGE_ACCOUNT_SCOPE__"
    federated_credentials_advanced:
      tempo:
        subject_identifier: "system:serviceaccount:monitoring:tempo-sa"
  loki:
    role_assignments:
      storage_contributor:
        definition: "Storage Blob Data Contributor"
        relative_scope: "__STORAGE_ACCOUNT_SCOPE__"
    federated_credentials_advanced:
      loki:
        subject_identifier: "system:serviceaccount:monitoring:loki-sa"
